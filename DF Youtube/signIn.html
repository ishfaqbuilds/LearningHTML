<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
  </head>
  <body style="margin: 0px; background-color: #f8f8f8">
    <main
      style="
        width: 500px;
        height: 600px;
        margin: 80px auto;
        padding: 40px;
        background-color: white;
        border-radius: 15px;
      "
    >
      <header style="text-align: center;">
        <h2>WELCOME TO DF YOUTUBE</h2>
        <p>
          Access your dashboard and unleash the full <br />
          power of DF YouTube
        </p>
      </header>

      <section style="text-align: center;">
        <button style="width: 400px; height: 40px; text-align: center; font-size: 17px; background-color: whitesmoke; border-radius: 20px;">Continue with Google</button>
        <br><br>
        <p style="text-align: center; margin: 10px; color: #555;">---------------------------- Or, sign in with your email ---------------------------- </p>
      </section>
      <br> <br> 

      <form action="index.html">
        <div style="margin-bottom: 20px;">
            <label for="email" style="display: block; margin-bottom: 10px;">Email</label>
            <input id="email" type="email" name="email" placeholder="Enter Your Email" style="width: 480px; height: 25px; padding: 5px; border-radius: 20px; background-color: whitesmoke;">
        </div>

        <div style="margin-bottom: 20px;">
            <label for="password" style="display: block; margin-bottom: 10px;">Passwords</label>
            <input id="password" type="password" name="password" placeholder="Enter Your Passwords" style="width: 480px; height: 25px; padding: 5px; border-radius: 20px; background-color: whitesmoke;">
            <br><br> <a href="#" style="display: block; text-align: right; margin-right: 7px;">Forgot Password?</a>
        </div>

        <input
            style="display: block; margin: auto; width: 300px; padding: 10px; border-radius: 20px; background-color: black; color: white; font-size: 17px;"
            type="submit"
            value="Login"
        >
      </form>

      <footer style="text-align: center; margin-top: 10px;">
            <p> Don't have an Account? <a href="#" style="color: black; font-weight: bold;"> Register</a></p>
    </footer>

    </main>
  </body>
</html>
